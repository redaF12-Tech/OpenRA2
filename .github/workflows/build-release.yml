name: Build OpenRA2 Ready Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout OpenRA2 Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Fetch OpenRA Engine Dependencies
      shell: cmd
      run: |
        make.cmd fetch

    - name: Compile OpenRA2 Engine
      shell: cmd
      run: |
        make.cmd all

    - name: Create Game Launch Script (Windows Portable)
      shell: cmd
      run: |
        echo @echo off > Launch-OpenRA2.bat
        echo if exist "engine\OpenRA.exe" ( >> Launch-OpenRA2.bat
        echo     start "" "engine\OpenRA.exe" Game.Mod=ra2 >> Launch-OpenRA2.bat
        echo ) else if exist "OpenRA.exe" ( >> Launch-OpenRA2.bat
        echo     start "" "OpenRA.exe" Game.Mod=ra2 >> Launch-OpenRA2.bat
        echo ) else ( >> Launch-OpenRA2.bat
        echo     start "" "engine\bin\OpenRA.exe" Game.Mod=ra2 >> Launch-OpenRA2.bat
        echo ) >> Launch-OpenRA2.bat

    - name: Prepare Content Directory Structure
      shell: cmd
      run: |
        if not exist "Content\ra2" mkdir "Content\ra2"
        echo Place your RA2 .mix files here > Content\ra2\README.txt

    - name: Create Portable Package Dynamic Search
      shell: pwsh
      run: |
        # إنشاء المجلد المؤقت للحزمة
        New-Item -ItemType Directory -Path "dist_release" -Force
        
        # نسخ المجلدات والملفات المتاحة ديناميكياً
        $itemsToCopy = @("mods", "engine", "Content", "Launch-OpenRA2.bat", "VERSION", "mod.config")
        foreach ($item in $itemsToCopy) {
            if (Test-Path $item) {
                Copy-Item -Path $item -Destination "dist_release\" -Recurse -Force
            }
        }
        
        # نسخ أي ملفات تشغيل وحزم DLL في المجلد الرئيسي إن وجدت
        Get-ChildItem -Path . -File -Include *.exe, *.dll, *.config | Copy-Item -Destination "dist_release\" -Force

        # ضغط مجلد الحزمة بالكامل بدون أخطاء المسارات غير الموجودة
        Compress-Archive -Path "dist_release\*" -DestinationPath "OpenRA2-Windows-Ready.zip" -Force

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: OpenRA2-Windows-Executable
        path: OpenRA2-Windows-Ready.zip
        retention-days: 7
